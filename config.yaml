samples: "metadata.tsv"

reference:
  genome: "reference/GRCh38.d1.vd1.fa"
  transcripts: "reference/gencode.v36.transcripts.fa"
  gtf: "reference/gencode.v36.annotation.gtf"
  tx2gene: "reference/tx2gene.tsv"

build_index: true
salmon_index: "resources/salmon_GRCh38.d1.vd1_GENCODEv36"

threads:
  index: 12
  salmon: 8
  fastqc: 2
  bam_to_fastq: 4
  sra_to_fastq: 6

salmon:
  libtype: "A"
  validateMappings: true
  seqBias: true
  gcBias: true
  # Add extra Salmon quant arguments here, e.g. "--numBootstraps 30"
  extra: ""




##########################################
# DESeq2
##########################################
OrgDb: org.Mm.eg.db
#OrgDb: org.Hs.eg.db



#Gene column in Gene_Level_Raw_Counts.txt
gene_id_type: SYMBOL # ENSEMBL

enrichr_databases:
  - KEGG_2021_Mouse
  - GO_Biological_Process_2023
  - GO_Cellular_Component_2023
  - GO_Molecular_Function_2023

#enrichr_databases:
#  - KEGG_2021_Human
#  - WikiPathway_2023_Human
#  - Reactome_2022
#  - GO_Biological_Process_2023
#  - GO_Cellular_Component_2023
#  - GO_Molecular_Function_2023

# Treatment column in metadata.txt

comparisons:

  ##################################################
  # A. APP EFFECTS WITHIN EACH GENOTYPE
  ##################################################

  # ND6
  - group1: "ND6_1x"
    group2: "ND6_0"
  - group1: "ND6_2x"
    group2: "ND6_0"
  - group1: "ND6_2x"
    group2: "ND6_1x"

  # NZB
  - group1: "NZB_1x"
    group2: "NZB_0"
  - group1: "NZB_2x"
    group2: "NZB_0"
  - group1: "NZB_2x"
    group2: "NZB_1x"

  # B6J
  - group1: "B6J_1x"
    group2: "B6J_0"

  # 129
  - group1: "129_1x"
    group2: "129_0"


  ##################################################
  # B. GENOTYPE EFFECTS WITHOUT APP (0)
  ##################################################

  - group1: "ND6_0"
    group2: "NZB_0"
  - group1: "ND6_0"
    group2: "B6J_0"
  - group1: "ND6_0"
    group2: "129_0"

  - group1: "NZB_0"
    group2: "B6J_0"
  - group1: "NZB_0"
    group2: "129_0"

  - group1: "B6J_0"
    group2: "129_0"


  ##################################################
  # C. GENOTYPE EFFECTS WITH ONE APP COPY (1x)
  ##################################################

  - group1: "ND6_1x"
    group2: "NZB_1x"
  - group1: "ND6_1x"
    group2: "B6J_1x"
  - group1: "ND6_1x"
    group2: "129_1x"

  - group1: "NZB_1x"
    group2: "B6J_1x"
  - group1: "NZB_1x"
    group2: "129_1x"

  - group1: "B6J_1x"
    group2: "129_1x"


  ##################################################
  # D. GENOTYPE EFFECTS WITH TWO APP COPIES (2x)
  ##################################################

  - group1: "ND6_2x"
    group2: "NZB_2x"


# DESeq2 covariates
# To run without covariates: covariates: []
covariates:
  - AgeMonths
  - Sex
